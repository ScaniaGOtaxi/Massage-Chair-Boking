          files = json.loads(gzip.decompress(packed))
          root = Path('/tmp/qfsv-features-build')
          root.mkdir(parents=True, exist_ok=True)
          for name, contents in files.items():
              p = root/name
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(contents)
          image = Path('massage-chair-v2.png')
          if not image.is_file():
              raise SystemExit('Spara stolbilden från chatten som massage-chair-v2.png och ladda upp den i roten av GitHub-repot.')
          if image.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Bilden måste vara en PNG-fil, inte bara ha filändelsen .png.')
          shutil.copyfile(image, root/'src/massage-chair-v2.png')
          source = Path('.qfsv-base/deployment/onecom/MassageBoking').resolve()
          app = root/'paket/MassageBoking'
          sys.argv = [str(root/'build.py'), str(source), str(app)]
          runpy.run_path(str(root/'build.py'), run_name='__main__')
          package = app.parent
          shutil.copytree(root/'database', package/'Supabase')
          shutil.copyfile(root/'LAS-MIG.txt', package/'LAS-MIG.txt')
          shutil.copytree(root/'src', package/'Utveckling/src')
          shutil.copyfile(root/'build.py', package/'Utveckling/build.py')
          target = Path('deployment/onecom')
          for name in ['MassageBoking', 'Supabase', 'Utveckling']:
              dest = target/name
              if dest.exists():
                  shutil.rmtree(dest)
              shutil.copytree(package/name, dest)
          shutil.copyfile(package/'LAS-MIG.txt', target/'LAS-MIG-funktioner-v2.txt')
          with zipfile.ZipFile('qfsv-onecom-funktioner-v2.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for p in package.rglob('*'):
                  if p.is_file():
                      archive.write(p, p.relative_to(package))
          PYBUILD
      - name: Kontrollera JavaScript
        run: |
          find deployment/onecom/MassageBoking -name '*.js' -exec node --check {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: qfsv-onecom-funktioner-v2
          path: qfsv-onecom-funktioner-v2.zip
          if-no-files-found: error
      - name: Spara i separat gren
        run: |
          git switch -c "onecom-funktioner-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/onecom/MassageBoking deployment/onecom/Supabase deployment/onecom/Utveckling deployment/onecom/LAS-MIG-funktioner-v2.txt
          git commit -m "Statistik, avbokning, utloggning och startbild"
          git push origin HEAD
