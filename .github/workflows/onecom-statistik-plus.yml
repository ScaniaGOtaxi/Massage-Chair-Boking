      - name: Bygg och testa
        run: |
          python3 deployment/onecom/statistik-plus-source/build.py deployment/onecom/MassageBoking deployment/onecom/statistik-plus-source/release/MassageBoking
          node --test deployment/onecom/statistik-plus-source/tests/analytics.test.mjs
          find deployment/onecom/statistik-plus-source/release/MassageBoking -name '*.js' -exec node --check {} \;
          python3 - <<'PYPACK'
          from pathlib import Path
          import shutil,zipfile
          source=Path('deployment/onecom/statistik-plus-source/release/MassageBoking')
          target=Path('deployment/onecom/MassageBoking')
          shutil.rmtree(target)
          shutil.copytree(source,target)
          shutil.rmtree(source.parent)
          with zipfile.ZipFile('qfsv-statistik-plus.zip','w',zipfile.ZIP_DEFLATED) as z:
           for p in target.rglob('*'):
            if p.is_file():z.write(p,'MassageBoking/'+str(p.relative_to(target)))
           z.writestr('LAS-MIG.txt','Säkerhetskopiera MassageBoking på one.com. Ladda upp ALLT i MassageBoking, även hela assets. Behåll massage-splash.png och egna filer. Radera inte servermappen. Ctrl+F5. Admin > Statistik. Ingen ny SQL behövs. Beläggning gäller en stol, kl 06-17 alla dagar som standard; anpassa dagar, tider och stängda datum i vyn. Inställningarna sparas inte och ändrar inte bokningsreglerna. Statistik PLUS räknar till och med idag. Raderade avbokningar saknas. Ordinarie PDF/CSV behålls; nya mått finns i Exportera utökad CSV. Vit startvy, samma dags-bokning och utloggning i inställningar behålls. Återställ säkerhetskopian vid behov.')
          PYPACK
      - uses: actions/upload-artifact@v4
        with:
          name: qfsv-statistik-plus
          path: qfsv-statistik-plus.zip
          if-no-files-found: error
      - name: Spara i GitHub
        run: |
          git switch -c "onecom-statistik-plus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/onecom qfsv-statistik-plus.zip
          git commit -m "Statistik PLUS och enhetlig vit design"
          git push origin HEAD
