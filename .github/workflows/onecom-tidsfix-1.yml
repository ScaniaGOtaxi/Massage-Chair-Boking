name: Reparera bokningstider pa one.com

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tidsfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 05809be0fa4a06cc65f1bdf9082061f1f4387f6d

      - name: Reparera testversionen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          root = Path('deployment/onecom/MassageBoking')
          assets = root / 'assets'
          p = assets / 'BookingsAndStats-CtIRhBIX.js'
          source = p.read_text()

          expected = 'c94019f56eb387237151b4c350d9bfc8f9058931bd6a72875e9639fcbe078844'
          if hashlib.sha256(p.read_bytes()).hexdigest() != expected:
              raise SystemExit('Appversionen skiljer sig. Avbryter utan att skriva over.')

          module = r"""
          export const TIME_ZONE = 'Europe/Stockholm';
          const OPEN = 360, CLOSE = 1020;
          const dates = new Intl.DateTimeFormat('sv-SE', {
            timeZone: TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit'
          });
          const clock = new Intl.DateTimeFormat('en-GB', {
            timeZone: TIME_ZONE, hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
          });
          export const formatDate = date => dates.format(date);

          export function validDate(value) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
            const parsed = new Date(value + 'T00:00:00Z');
            return Number.isFinite(parsed.getTime()) &&
              parsed.toISOString().slice(0, 10) === value;
          }

          function minutes(time) {
            if (typeof time !== 'string' ||
                !/^([01]\d|2[0-3]):[0-5]\d(?::00(?:\.0+)?)?$/.test(time)) {
              throw new Error('Invalid time format');
            }
            const [h, m] = time.split(':').map(Number);
            return h * 60 + m;
          }

          const printTime = n =>
            `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`;

          function checkSessions(n) {
            if (!Number.isInteger(n) || n < 1 || n > 2) {
              throw new Error('Choose 1 or 2 sessions');
            }
          }

          export function calculateEndTime(start, sessions) {
            checkSessions(sessions);
            const from = minutes(start), to = from + sessions * 20;
            if (from < OPEN || (from - OPEN) % 20 !== 0 || to > CLOSE) {
              throw new Error('Choose a 20-minute slot between 06:00 and 17:00');
            }
            return printTime(to);
          }

          export function validateBooking(date, start, sessions, now = new Date()) {
            if (!validDate(date)) throw new Error('Choose a valid date');
            const end = calculateEndTime(start, sessions);
            const today = formatDate(now);
            if (date < today ||
                (date === today && minutes(start) <= minutes(clock.format(now)))) {
              throw new Error('Cannot book a time in the past');
            }
            return end;
          }

          export async function generateTimeSlots(
            date, selectedTime = null, sessions = 1, bookings = [], now = new Date()
          ) {
            void selectedTime;
            checkSessions(sessions);
            if (!validDate(date)) return [];
            const today = formatDate(now);
            const current = minutes(clock.format(now));
            const intervals = bookings.filter(b => b.date === date).map(b => ({
              start: minutes(b.start_time), end: minutes(b.end_time), name: b.name
            }));
            return Array.from({length: (CLOSE - OPEN) / 20}, (_, i) => {
              const from = OPEN + i * 20, to = from + sessions * 20;
              const past = date < today || (date === today && from <= current);
              const booked = intervals.find(b => from < b.end && to > b.start);
              const reason = past ? (booked ? 'past_booked' : 'past_unbooked')
                : booked ? 'booked' : to > CLOSE ? 'invalid_duration' : undefined;
              return {
                time: printTime(from),
                isAvailable: !reason,
                unavailableReason: reason,
                bookedBy: booked?.name,
                tooltip: booked
                  ? `This time slot is booked by ${booked.name || 'another user'}`
                  : past ? 'This time has passed'
                  : reason ? 'Booking must end by 17:00' : undefined
              };
            });
          }
          """

          patches = [
              (16174, 16275, '(date,time)=>{try{QFSV_validate(date,time.slice(0,5),1);return true;}catch{return false;}}'),
              (15823, 16023, 'QFSV_end'),
              (15344, 15386, '_.from("bookings").update(x).eq("id",m.id).select("id").single()'),
              (15233, 15286, 'QFSV_validate(String(r.get("date")),String(r.get("start_time")).slice(0,5),Number(r.get("sessions")))'),
              (14801, 14839, '_.from("bookings").delete().eq("id",s).select("id").single()'),
              (7467, 7491, 'QFSV_validate(t.date,t.timeSlot,t.sessions)'),
              (6946, 7088, '''h.useEffect(()=>{
                let cancelled=false;
                const update=async()=>{
                  try {
                    const slots=await Y(o,a,p,i);
                    if(cancelled)return;
                    f(slots);
                    if(a&&!slots.some(slot=>slot.time===a&&slot.isAvailable)){
                      l(null);S("timeSlot","");
                    }
                  } catch(error){
                    console.error("Could not refresh availability",error);
                    if(!cancelled)f([]);
                  }
                };
                void update();
                const timer=window.setInterval(update,15000);
                return()=>{cancelled=true;window.clearInterval(timer);};
              },[o,a,p,i,S])'''),
              (6090, 6385, 'H.object({date:H.string().refine(d=>QFSV_validDate(d)&&d>=W(new Date),"Cannot book dates in the past"),timeSlot:H.string().regex(/^([0-1][0-9]|2[0-3]):[0-5][0-9]$/,"Invalid time format"),sessions:H.number().int().min(1).max(2,"Maximum 2 sessions allowed")})'),
              (4275, 6087, 'const W=QFSV_date,X=QFSV_end,Y=QFSV_slots,')
          ]

          for start, end, replacement in patches:
              source = source[:start] + replacement + source[end:]

          source = (
              'import {formatDate as QFSV_date,calculateEndTime as QFSV_end,'
              'generateTimeSlots as QFSV_slots,validateBooking as QFSV_validate,'
              'validDate as QFSV_validDate} from "./qfsv-booking-times-v1.js";\n'
          ) + source

          p.write_text(source)
          (assets / 'qfsv-booking-times-v1.js').write_text(module)

          names = {
              p.name: p.stem + '.timefix1.js'
              for p in assets.glob('*.js')
          }
          for p in [root / 'index.html', *assets.glob('*.js')]:
              text = p.read_text()
              for old, new in names.items():
                  text = text.replace(old, new)
              p.write_text(text)
          for old, new in names.items():
              (assets / old).rename(assets / new)

          with zipfile.ZipFile('qfsv-tidsfix-1.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file():
                      z.write(p, p.relative_to(root.parent))

          print('Bokningstider reparerade. Databasen har inte andrats.')
          PY

      - name: Kontrollera JavaScript
        shell: bash
        run: |
          for file in deployment/onecom/MassageBoking/assets/*.js; do
            node --check "$file"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: qfsv-tidsfix-1
          path: qfsv-tidsfix-1.zip

      - name: Spara pa separat gren
        shell: bash
        run: |
          branch="onecom-tidsfix-1-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add -- deployment/onecom/MassageBoking
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix booking availability and time validation'
          git push origin "$branch"
