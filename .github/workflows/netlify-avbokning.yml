name: Reparera avbokning

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f7cdfd75ffad1a03345c2152997022b18bfa6a2

      - name: Ratta avbokningsanropet
        run: |
          python3 - <<'PYBUILD'
          from pathlib import Path
          import zipfile

          out=Path('deployment/netlify-app-v2')
          count=0

          for p in (out/'assets').glob('qfsv-feature-rules-v2*.js'):
           text=p.read_text()
           start=text.index('export async function cancelOwnBooking(')
           end=text.index('\nconst pending=',start)
           block=text[start:end]
           old=".select('id').single()"
           assert block.count(old)==1
           block=block.replace(
            old,
            ".select('id,user_id,date,start_time').single()"
           )
           p.write_text(text[:start]+block+text[end:])
           count+=1

          assert count==1, f'Oväntat antal avbokningsmoduler: {count}'

          files=list(out.rglob('*.js'))
          names={
           p.name:p.stem+'.cancel1.js'
           for p in files if p.name!='sw.js'
          }

          for p in out.rglob('*'):
           if p.is_file() and p.suffix in ['.js','.html']:
            text=p.read_text()
            for old,new in names.items():
             text=text.replace(old,new)
            p.write_text(text)

          for p in files:
           if p.name in names:
            p.rename(p.with_name(names[p.name]))

          with zipfile.ZipFile(
           'qfsv-netlify-avbokning.zip','w',zipfile.ZIP_DEFLATED
          ) as archive:
           for p in out.rglob('*'):
            if p.is_file():
             archive.write(p,'netlify-app/'+str(p.relative_to(out)))
           archive.writestr(
            'LAS-MIG.txt',
            'Hela Netlify-appen med avbokningsfix. '
            'Ladda upp mappen netlify-app under Netlify > qfsv > Deploys. '
            'Ctrl+F5. Prova att avboka din egen kommande tid. '
            'Ingen SQL eller databasändring behövs. '
            'Helskärm, valfri installation och statistik behålls.'
           )

          print('Avbokningsanropet är rättat.')
          PYBUILD

      - name: Kontrollera JavaScript
        run: find deployment/netlify-app-v2 -name '*.js' -exec node --check {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: qfsv-netlify-avbokning
          path: qfsv-netlify-avbokning.zip
          if-no-files-found: error

      - name: Spara i GitHub
        run: |
          git switch -c "netlify-avbokning-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/netlify-app-v2 qfsv-netlify-avbokning.zip
          git commit -m "Ratta avbokningens retursvar for PostgREST"
          git push origin HEAD
